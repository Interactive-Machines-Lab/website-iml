<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="author" content="www.luigipacheco.com">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>{% if page.url != "/" and page.title %}{{ page.title | escape }} · {% endif %}{{ site.description }}</title>
  {%- seo title=false -%}

  {% if page.robots %}
    <meta name="robots" content="{{ page.robots }}" />
  {% endif %}

  <link rel="icon" type="image/svg+xml" href="{{ 'assets/images/iml-mark.svg' | relative_url }}">

  <!-- IML design system, screen faces: Archivo Black (titles) and Space Mono (everything else). -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">

  <link rel="stylesheet" type="text/css" href="{{ 'assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
